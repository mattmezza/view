# Copy to ~/.config/view/config (or $XDG_CONFIG_HOME/view/config).
# Use Ctrl+r to reload. Colors also follow live Xresources changes.

xresources = true
gallery = true
sidebar = true
wrap = true
upscale = false
check_updates = true

width = 1120
height = 780
font_size = 14
thumb_size = 78
sidebar_width = 168
padding = 28
scroll_step = 108
zoom_step = 1.25

# Optional absolute or ~/ font paths. Geist and Geist Mono are built in.
# font = ~/.local/share/fonts/Geist/Geist-Regular.ttf
# font_bold = ~/.local/share/fonts/Geist/Geist-SemiBold.ttf
# font_mono = ~/.local/share/fonts/Geist/GeistMono-Regular.ttf

# Colors override view.* and wildcard Xresources values.
# color.background = #120000
# color.canvas = #100000
# color.surface = #1d0b0b
# color.raised = #281616
# color.border = #3b202b
# color.foreground = #feebea
# color.muted = #ab9898
# color.accent = #e568d0

# Up to four comma-separated X11 key names per action. Empty disables a binding.
key.open = Ctrl+o
key.prev = Left,h
key.next = Right,l
key.first = Home
key.last = End
key.zoom-in = equal,plus,KP_Add
key.zoom-out = minus,KP_Subtract
key.fit = 0
key.actual = 1
key.fullscreen = f,F11
key.gallery = g
key.sidebar = t
key.find = Ctrl+f,slash
key.find-next = n,F3
key.find-prev = Shift+n,Shift+F3
key.copy = Ctrl+c
key.up = Up,k
key.down = Down,j
key.page-up = Page_Up
key.page-down = Page_Down,space
key.reload = Ctrl+r
key.help = F1,Shift+slash
key.quit = q,Ctrl+w
